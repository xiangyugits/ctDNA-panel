# ===== 项目路径配置 =====
paths:
  # 输入数据
  data_dir: "/home/zhangli_lab/zhouxiangyu/DATA/projects/CIBR-ZHANGLI/ctDNA"
  fastq_dir: "/home/zhangli_lab/zhouxiangyu/DATA/projects/CIBR-ZHANGLI/ctDNA/fastq"
  
  # 输出根目录
  output_dir: "/home/zhangli_lab/zhouxiangyu/DATA/projects/CIBR-ZHANGLI/ctDNA/results"
  

# ===== 样本配置 =====
samples:
  tumor:
    - '202611'
    - '202612'
    - '202613'
    - '202614'
    - '202615'
  normal:
    - NC

# ===== 参考文件配置 =====
reference:
  genome: "hg19"
  fasta: "/home/zhangli_lab/zhouxiangyu/DATA/genome/human/hg19/hg19.fa"
  bwa_mem2_index: "/home/zhangli_lab/zhouxiangyu/DATA/genome/human/hg19/bwa-mem2/hg19"

  # Panel 目标区域
  target_bedGZ: "/home/zhangli_lab/zhouxiangyu/DATA/projects/CIBR-ZHANGLI/ctDNA/resource/loci.bed.gz"
  # panelcn.MOPS 需要非压缩 BED 文件（如果 target_bed 是 .gz，请另外提供解压版本）
  target_bed: "/home/zhangli_lab/zhouxiangyu/DATA/projects/CIBR-ZHANGLI/ctDNA/resource/loci.bed"
  
  # 种系资源数据库
  #群体胚系变异资源（如gnomAD vcf），用于区分体细胞与胚系突变
  germline_resource: "/home/zhangli_lab/zhouxiangyu/DATA/genome/human/hg19/gnomAD/af-only-gnomad.raw.hg19.vcf.gz"
  germline_resource_idx: "/home/zhangli_lab/zhouxiangyu/DATA/genome/human/hg19/gnomAD/af-only-gnomad.raw.hg19.vcf.gz.tbi"
  
# ===== 变异检测参数 =====
variant_calling:
  # SNV 检测
  snv:
    tool: "mutect2"
    min_base_quality: 20
    contamination_estimate: 0.002
    
  # CNV 检测
  cnv:
    tool: "cnvkit"
    min_mapq: 30
    
  # SV 检测
  sv:
    tool: "delly"
    min_mapq: 30

# ===== 过滤参数 =====
filtering:
  # SNV 严格过滤
  snv:
    min_vaf: 0.01                  # 最低等位基因频率
    min_tlod: 25                    # 最低肿瘤对照比值（INFO/TLOD）
    min_depth: 30                   # 最低测序深度
    min_mq: 30                      # 最低平均测序质量（INFO/MMQ）
    min_ad: 10                       # 最少支持变异的reads数（INFO/AD）
    max_gnomad_af: 0.01            # 最高人群频率

  # CNV 过滤
  cnv:
    min_log2_abs: 0.3               # 最少 log2 比值（CNVkit 用）
    min_probes: 5                   # 最少连续探针数（CNVkit 用）
    max_ci: 1.0                     # 最大置信区间（CNVkit 用）

    # ── panelcn.MOPS 专用过滤参数（扩增子 Panel 推荐）──────────────
    # 若未设置，以上 CNVkit 参数将作为默认值回退
    panelcnmops_min_log2_abs:    0.3    # 基因级 |log2ratio| 最低阈值（建议同 CNVkit）
    panelcnmops_min_amplicons:   2      # 基因内最少 amplicon 数（对应 min_probes）
    panelcnmops_max_ci:          2.0    # CI 上限（panelcn.MOPS p值推算的 CI 尺度更大）
    panelcnmops_min_cnv_fraction: 0.3   # 基因内 CNV amplicon 比例 >= 30%（防单点噪音）
    panelcnmops_min_pvalue:      0.05   # 最高 p 值阈值（显著性过滤）
    panelcnmops_alpha:           0.05   # panelcn.MOPS 内部检测显著性阈值
    panelcnmops_min_rc:          1      # 每个 amplicon 最低 read count
    
  # SV 过滤
  sv:
    delly_sv_types: "DEL,DUP,INV,INS,TRA,BND"  # 检测的SV类型
    delly_min_mapq: 20                          # 最小比对质量
    delly_min_support: 3                        # 最小支持reads数

    # ── 替代 SV 工具配置（扩增子 Panel 推荐）─────────────────
    # GRIDSS2
    gridss_blacklist: ""                        # 重复区域黑名单 BED（建议提供）
    # SvABA
    svaba_target_regions: ""                    # 靶向区域 BED（可选，默认用 target_bed）
    svaba_min_mapq: 5                           # 最小比对质量
    svaba_min_support: 2                        # 最小支持 reads 数
    # 靶向融合检测
    fusion_min_mapq: 20                         # 最小比对质量
    fusion_min_support: 2                       # 最小支持 reads 数
    fusion_flank: 500                           # BED 区域外扩 bp

# ===== 工具路径配置 =====
# 如果工具不在 PATH 中，在此处指定完整路径
tools:
  # panelcn.MOPS 所在 conda 环境的 Rscript
  rscript: "~/DATA/miniconda3/envs/panelcnmops/bin/Rscript"
  # CNVkit 路径（原有配置，集中管理）
  cnvkit:  "~/DATA/miniconda3/envs/smk-ctdna/bin/cnvkit.py"
  # GRIDSS2 jar 路径（assembly-based SV 检测）
  gridss_jar: "/home/zhangli_lab/zhouxiangyu/DATA/software/gridss/gridss.jar"

annotation:
  annovar:
    install_dir: "/home/zhangli_lab/zhouxiangyu/DATA/software/annovar"
    db_dir: "/home/zhangli_lab/zhouxiangyu/DATA/software/annovar/humandb"
    target_genes: "/home/zhangli_lab/zhouxiangyu/projects/CIBR-ZHANGLI/ctDNA/resource/target.geneList.txt"
    
    # hg19 数据库
    protocols:
      - refGene
      - avsnp147
      - clinvar
      - cosmic70
      - dbscsnv11
      - revel
      - gnomad_genome
  
  post_annotation:
    gene_lists:
      cancer_genes: "/data/databases/gene_lists/cancer_gene_census.txt"
      actionable_genes: "/data/databases/gene_lists/actionable_genes.txt"


# ===== 计算资源配置 =====
resources:
  default_threads: 4
  default_memory_mb: 16000
  bwa_threads: 6
  bwa_memory_mb: 32000
  umi_threads: 6
  fgbio_memory_mb: 32000
  mutect_threads: 8
  mutect_memory_mb: 32000
  manta_threads: 8
  manta_memory_mb: 32000
  # Delly 配置
  delly_call_threads: 4
  delly_call_memory: 8000
  delly_filter_threads: 2
  delly_filter_memory: 4000